[workspace]
members = [
    "crates/geneaquilt-core",
    "crates/geneaquilt-layout",
    "crates/geneaquilt-wasm",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "BSD-3-Clause"
authors = ["GeneaQuilt contributors"]
repository = "https://github.com/AShortcuts/GeneaQuilt-New"

[workspace.lints.rust]
unsafe_code = "forbid"

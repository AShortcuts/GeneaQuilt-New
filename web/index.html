    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f3eee5" />
    <style>
      html {
        background: #f3eee5;
        color-scheme: light;
      }

      @media (prefers-color-scheme: dark) {
        html:not([data-theme]) {
          background: #171a17;
          color-scheme: dark;
        }
      }

      html[data-theme="light"] {
        background: #f3eee5;
        color-scheme: light;
      }

      html[data-theme="dark"] {
        background: #171a17;
        color-scheme: dark;
      }
    </style>
    <script>
      (() => {
        const storedTheme = localStorage.getItem("geneaquilt-theme");
        const mediaTheme = window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
        const initialTheme =
          storedTheme === "light" || storedTheme === "dark" ? storedTheme : mediaTheme;
        const root = document.documentElement;

        root.dataset.theme = initialTheme;
        root.style.colorScheme = initialTheme;
        document.querySelector('meta[name="theme-color"]').content =
          initialTheme === "dark" ? "#171a17" : "#f3eee5";
      })();
    </script>

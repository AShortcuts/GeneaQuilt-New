  <circle cx="1120" cy="-40" r="290" fill="#f5e7d1" opacity="0.78" />
  <circle cx="-55" cy="615" r="250" fill="#e4ece5" opacity="0.72" />
  <rect width="1200" height="8" fill="url(#top-thread)" />

  <g transform="translate(88 68)">

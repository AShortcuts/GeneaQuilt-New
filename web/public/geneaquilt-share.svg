<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="top-thread" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4b6958" />
      <stop offset="0.55" stop-color="#a96f32" />
      <stop offset="1" stop-color="#b75f45" />
    </linearGradient>
    <pattern id="paper-lines" width="9" height="9" patternUnits="userSpaceOnUse">
      <path d="M0 0V9" stroke="#2d312b" stroke-opacity="0.026" />
    </pattern>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#3b3327" flood-opacity="0.14" />
    </filter>
    <clipPath id="quilt-clip">
      <rect width="410" height="514" rx="28" />
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="#f3eee5" />

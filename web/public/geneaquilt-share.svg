    <text x="70" y="46" fill="#6a6f65" font-family="Avenir Next, Avenir, sans-serif" font-size="16">Private, visual GEDCOM exploration</text>
  </g>

  <text x="88" y="214" fill="#2d312b" font-family="Charter, Georgia, serif" font-size="76" font-weight="700" letter-spacing="-2.4">GeneaQuilt</text>
  <text x="88" y="286" fill="#365143" font-family="Charter, Georgia, serif" font-size="42" font-weight="600" letter-spacing="-0.8">See the whole family story.</text>
  <text x="88" y="345" fill="#6a6f65" font-family="Avenir Next, Avenir, sans-serif" font-size="21">
    <tspan x="88" dy="0">Turn a dense family tree into one calm, coherent map.</tspan>
    <tspan x="88" dy="33">Follow every branch without losing the bigger picture.</tspan>
  </text>

  <g transform="translate(88 495)" font-family="Avenir Next, Avenir, sans-serif" font-size="16" font-weight="600" fill="#4d554d">

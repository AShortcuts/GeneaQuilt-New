    <meta property="og:type" content="website" />

    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Compare Family-Tree Views | GeneaQuilt" />
    <meta
      property="og:description"
      content="Put two verified family-tree visualizations side by side on the same real genealogy sample."
    />
    <meta property="og:url" content="https://geneaquilt-new.pages.dev/visualizations.html" />
    <meta property="og:image" content="https://geneaquilt-new.pages.dev/geneaquilt-share.png" />

      property="og:image:alt"
      content="A warm GeneaQuilt sharing card showing an organized family-network quilt."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Compare Family-Tree Views | GeneaQuilt" />
    <meta
      name="twitter:description"
      content="Live, same-data comparisons of verified genealogy visualization methods."
    />
    <meta name="twitter:image" content="https://geneaquilt-new.pages.dev/geneaquilt-share.png" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f3eee5" />
    <style>
      html {
        background: #f3eee5;
        color-scheme: light;
      }

      @media (prefers-color-scheme: dark) {
        html:not([data-theme]) {
          background: #171a17;
          color-scheme: dark;
        }
      }

      html[data-theme="light"] {
        background: #f3eee5;
        color-scheme: light;
      }

      html[data-theme="dark"] {
        background: #171a17;
        color-scheme: dark;
      }
    </style>
    <script>
      (() => {
        const storedTheme = localStorage.getItem("geneaquilt-theme");
        const mediaTheme = window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
        const initialTheme =
          storedTheme === "light" || storedTheme === "dark" ? storedTheme : mediaTheme;
        const root = document.documentElement;
        root.dataset.theme = initialTheme;
        root.style.colorScheme = initialTheme;
        document.querySelector('meta[name="theme-color"]').content =
          initialTheme === "dark" ? "#171a17" : "#f3eee5";
      })();
    </script>
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="stylesheet" href="/src/workspace.css" />
    <link rel="stylesheet" href="/src/comparison.css" />
    <link rel="stylesheet" href="/src/siteHeader.css" />

    />
    <title>Compare Family-Tree Views | GeneaQuilt</title>
  </head>
  <body class="comparison-body">
    <a class="comparison-skip" href="#live-comparison">Skip to live comparison</a>
    <div id="comparison-app" aria-live="polite">
      <main class="comparison-loading">
        <p>Preparing the verified comparison sample on this device…</p>
      </main>
    </div>
    <script type="module" src="/src/comparisonMain.ts"></script>
  </body>
</html>
